name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    tags: ['kicdn-win-v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r windows/requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name kicdn --paths windows windows/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kicdn-windows-${{ github.run_number }}
          path: dist/kicdn.exe
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/kicdn.exe
          body: |
            ## KICDN Windows ${{ github.ref_name }}

            Multi-platform censorship circumvention app — Windows build.

            ### نصب / Install
            دانلود `kicdn.exe` و اجرا کنید.
            Download `kicdn.exe` and run.
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
